{% extends 'index.html' %}

{% block form %}
<form id="OrderForm">
    <label>日期：</label>
    <input type="date" id="date" required><br>

    <label>客戶名稱：</label>
    <input type="text" id="customer_name" required><br>

    <label>商品種類：</label>
    <select id="category" required>
        <option value="" selected disabled>請選擇</option>
        <option value="主食">主食</option>
        <option value="飲料">飲料</option>
        <option value="點心">點心</option>
        <option value="輕食">輕食</option>

    </select><br>

    <label>商品名稱：</label>
    <select id="product" required>
        <option value="" selected disabled>請先選種類</option>
    </select><br>

    <label>單價：</label>
    <input type="number" id="price" readonly><br>

    <label>數量：</label>
    <input type="number" id="amount" min="1" value="1" required><br>

    <label>小計：</label>
    <input type="number" id="total" readonly><br>

    <label>狀態：</label>
    <select id="status">
        <option value="unpaid" selected>未付款</option>
        <option value="paid">已付款</option>
        <option value="finished">已完成</option>
    </select><br>

    <label>備註：</label>
    <textarea id="note"></textarea><br>

    <button type="button" id="submit-btn">新增</button>

</form>

{% endblock%}
